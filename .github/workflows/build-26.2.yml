name: Build 26.2 modules

# The 26.2 modules need JDK 25 and Minecraft 26.2 metadata, so they are built
# here instead of on a developer machine. Each module is a standalone Gradle
# project with its own wrapper and is built in its own matrix entry.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fabric 26.2
            project: fabric/SimpleTranslate-Fabric-26.2
          - name: NeoForge 26.2
            project: neoforge/SimpleTranslate-NeoForge-26.2
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show toolchain
        working-directory: ${{ matrix.project }}
        run: |
          java -version
          chmod +x ./gradlew
          ./gradlew --version --no-daemon

      - name: Build ${{ matrix.name }}
        working-directory: ${{ matrix.project }}
        run: ./gradlew build --no-daemon --stacktrace

      # Gradle only prints the first line of a test failure. The JUnit XML keeps
      # the full stack trace, which is what makes a CI-only failure fixable.
      - name: Show test failures
        if: failure()
        working-directory: ${{ matrix.project }}
        run: |
          for f in build/test-results/test/*.xml; do
            [ -e "$f" ] || continue
            echo "===== $f"
            sed -n '1,500p' "$f"
          done

      - name: Upload ${{ matrix.name }} jars
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }} jars
          path: ${{ matrix.project }}/build/libs/*.jar
          if-no-files-found: error
